plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usbdacvolume.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.usbdacvolume.app'
        minSdk 29          // Android 10+ (hedef telefon: Android 12)
        targetSdk 34
        versionCode 2
        versionName '2.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

// Harici kütüphane yok (AppCompat/Material/libusb kaldırıldı): küçük APK, hızlı açılış.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
